<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="接客タイム">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<title>接客タイム管理</title>
<style>
:root{--bg:#f7f7f8;--panel:#fff;--line:#d8dbe2;--text:#111827;--muted:#6b7280;--done:#e8f4ff;--done-line:#5a9bd5;--accent:#111827;--warn:#fff3cd}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif}
button,input{font:inherit}.app{padding:14px 14px 28px}.topbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.title{font-size:22px;font-weight:800}.sub{font-size:13px;color:var(--muted);margin-top:2px}.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{min-height:44px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px 14px;font-weight:700}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.hint{font-size:13px;color:var(--muted);margin:0 0 10px}.board{overflow:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:16px;background:var(--panel)}
table{border-collapse:separate;border-spacing:0;min-width:1320px;width:100%;font-size:12px}th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;text-align:center;vertical-align:middle}
th{background:#f2f3f5;font-weight:800;white-space:nowrap;position:sticky;top:0;z-index:2}th:first-child,td:first-child{position:sticky;left:0;z-index:3;background:#f8f8f9}th:first-child{z-index:4}
tr:last-child td{border-bottom:0}th:last-child,td:last-child{border-right:0}.seat{width:64px}.timeinput{width:92px;min-height:44px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:4px;font-size:16px}
.elapsed{font-weight:900;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}.step{width:84px;min-height:58px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:5px;font-weight:800;line-height:1.15}
.step.done{background:var(--done);border-color:var(--done-line)}.step .t{display:block;font-size:14px;margin-top:5px;font-variant-numeric:tabular-nums}.next{min-height:48px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:6px 9px;font-weight:800}
.late{background:var(--warn)!important}.footer{margin-top:10px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:12px}
dialog{border:0;border-radius:16px;padding:0;max-width:520px;width:calc(100% - 32px)}dialog::backdrop{background:rgba(0,0,0,.35)}.dialog-body{padding:18px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
</style>
</head>
<body>
<div class="app">
<div class="topbar"><div><div class="title">接客タイム管理</div><div id="dateLabel" class="sub"></div></div>
<div class="actions"><button id="addSeat" class="btn primary" type="button">＋ 席を追加</button><button id="historyBtn" class="btn" type="button">履歴</button><button id="resetBtn" class="btn" type="button">今日をリセット</button></div></div>
<p class="hint">来店をタップすると経過時間を開始。各工程をタップすると現在時刻を記録します。「次の組」で席番号を残したまま新しいお客様に切り替わります。</p>
<div class="board"><table><thead><tr>
<th>席</th><th>予約時間</th><th>経過時間</th><th>来店</th><th>説明</th><th>前菜</th><th>鍋のみ<br>スタート</th><th>鍋作り<br>終わり</th><th>山椒</th><th>スープ<br>追加</th><th>〆の発注</th><th>〆作り<br>終わり</th><th>あがり<br>おしぼり</th><th>会計</th><th>回転</th>
</tr></thead><tbody id="body"></tbody></table></div>
<div class="footer"><span>データはこの端末内に保存されます。</span><span id="saveState">保存済み</span></div>
</div>
<dialog id="historyDialog"><div class="dialog-body"><h3 style="margin:0 0 12px">今日の回転履歴</h3><div id="historyContent" style="max-height:60vh;overflow:auto"></div><div class="dialog-actions"><button id="closeHistory" class="btn" type="button">閉じる</button></div></div></dialog>
<script>
(() => {
const STEPS=["来店","説明","前菜","鍋のみスタート","鍋作り終わり","山椒","スープ追加","〆の発注","〆作り終わり","あがりおしぼり","会計"];
const KEY="service-time-pwa-v1";
const todayKey=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const timeFmt=new Intl.DateTimeFormat("ja-JP",{hour:"2-digit",minute:"2-digit",hour12:false});
const dateFmt=new Intl.DateTimeFormat("ja-JP",{year:"numeric",month:"long",day:"numeric",weekday:"short"});
const body=document.getElementById("body"),saveState=document.getElementById("saveState");
function uid(){return (crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()))}
function newSeat(label){return{id:uid(),seat:label,reservation:"",arrivedAt:null,logs:{},round:1}}
function defaultState(){return{date:todayKey(),seats:Array.from({length:6},(_,i)=>newSeat(String(i+1))),history:[]}}
function load(){try{const raw=localStorage.getItem(KEY);if(!raw)return defaultState();const s=JSON.parse(raw);return s.date===todayKey()?s:defaultState()}catch(e){return defaultState()}}
let state=load();
function save(){localStorage.setItem(KEY,JSON.stringify(state));saveState.textContent="保存済み"}
function markSaving(){saveState.textContent="保存中…";setTimeout(save,80)}
function elapsed(ms){const sec=Math.max(0,Math.floor(ms/1000));return String(Math.floor(sec/3600)).padStart(2,"0")+":"+String(Math.floor((sec%3600)/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0")}
function isLate(seat){if(!seat.reservation||seat.arrivedAt)return false;const [h,m]=seat.reservation.split(":").map(Number),now=new Date(),r=new Date();r.setHours(h,m,0,0);return now>r}
function render(){
document.getElementById("dateLabel").textContent=dateFmt.format(new Date());body.innerHTML="";
state.seats.forEach(seat=>{
const tr=document.createElement("tr");
const tdSeat=document.createElement("td"),inpSeat=document.createElement("input");inpSeat.className="timeinput seat";inpSeat.value=seat.seat;inpSeat.setAttribute("aria-label","席番号");inpSeat.addEventListener("input",()=>{seat.seat=inpSeat.value;markSaving()});tdSeat.appendChild(inpSeat);tr.appendChild(tdSeat);
const tdRes=document.createElement("td"),inpRes=document.createElement("input");inpRes.type="time";inpRes.className="timeinput";inpRes.value=seat.reservation;inpRes.addEventListener("input",()=>{seat.reservation=inpRes.value;markSaving();render()});tdRes.appendChild(inpRes);tr.appendChild(tdRes);
const tdElapsed=document.createElement("td"),sp=document.createElement("span");sp.className="elapsed";sp.textContent=seat.arrivedAt?elapsed(Date.now()-seat.arrivedAt):"--:--:--";tdElapsed.appendChild(sp);tr.appendChild(tdElapsed);
STEPS.forEach(step=>{const td=document.createElement("td");if(step==="来店"&&isLate(seat))td.classList.add("late");const b=document.createElement("button");b.type="button";b.className="step"+(seat.logs[step]?" done":"");const label=step.replace("鍋のみスタート","鍋のみ<br>スタート").replace("鍋作り終わり","鍋作り<br>終わり").replace("スープ追加","スープ<br>追加").replace("〆作り終わり","〆作り<br>終わり").replace("あがりおしぼり","あがり<br>おしぼり");b.innerHTML="<span>"+label+"</span><span class='t'>"+(seat.logs[step]||"記録")+"</span>";b.addEventListener("click",()=>{if(seat.logs[step]){delete seat.logs[step];if(step==="来店")seat.arrivedAt=null}else{const now=new Date();seat.logs[step]=timeFmt.format(now);if(step==="来店")seat.arrivedAt=now.getTime()}markSaving();render()});td.appendChild(b);tr.appendChild(td)});
const tdNext=document.createElement("td"),nb=document.createElement("button");nb.type="button";nb.className="next";nb.textContent="次の組";nb.addEventListener("click",()=>{const hasAny=seat.reservation||Object.keys(seat.logs).length;if(hasAny)state.history.push({seat:seat.seat,round:seat.round,reservation:seat.reservation,arrivedAt:seat.arrivedAt,logs:{...seat.logs},finishedAt:Date.now()});seat.round+=1;seat.reservation="";seat.arrivedAt=null;seat.logs={};markSaving();render()});tdNext.appendChild(nb);tr.appendChild(tdNext);
body.appendChild(tr);
});
}
function renderHistory(){const box=document.getElementById("historyContent");box.innerHTML="";if(!state.history.length){box.textContent="まだ履歴はありません。";return}[...state.history].reverse().forEach(h=>{const card=document.createElement("div");card.style.cssText="border:1px solid #d8dbe2;border-radius:12px;padding:10px;margin-bottom:8px";const title=document.createElement("div");title.style.fontWeight="800";title.textContent=h.seat+"卓・"+h.round+"組目　終了 "+timeFmt.format(new Date(h.finishedAt));const sub=document.createElement("div");sub.style.cssText="font-size:12px;color:#6b7280;margin-top:5px;line-height:1.6";const parts=[];if(h.reservation)parts.push("予約 "+h.reservation);STEPS.forEach(s=>{if(h.logs[s])parts.push(s+" "+h.logs[s])});sub.textContent=parts.join(" ｜ ")||"記録なし";card.append(title,sub);box.appendChild(card)})}
document.getElementById("addSeat").addEventListener("click",()=>{state.seats.push(newSeat(String(state.seats.length+1)));markSaving();render()});
document.getElementById("historyBtn").addEventListener("click",()=>{renderHistory();document.getElementById("historyDialog").showModal()});
document.getElementById("closeHistory").addEventListener("click",()=>document.getElementById("historyDialog").close());
document.getElementById("resetBtn").addEventListener("click",()=>{if(confirm("今日の記録と履歴をすべて消しますか？")){state=defaultState();save();render()}});
setInterval(()=>{document.querySelectorAll("#body tr").forEach((tr,i)=>{const seat=state.seats[i];if(!seat)return;const el=tr.querySelector(".elapsed");if(el)el.textContent=seat.arrivedAt?elapsed(Date.now()-seat.arrivedAt):"--:--:--";const arrivalCell=tr.children[3];if(arrivalCell)arrivalCell.classList.toggle("late",isLate(seat))})},1000);
if("serviceWorker"in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}
render();
})();
</script>
</body></html>
